<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whiteboard application</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body data-page="auth">
    <section id="auth-screen">
        <h2>Welcome to Whiteboard</h2>

        <div id="login-form">
            <h3>Login</h3>

            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Password">

            <button id="login-btn">Login</button>
            <p id="auth-status"></p>

            <p>Don't have an account?
                <button id="show-signup-btn">Sign Up</button>
            </p>
        </div>

        <div id="signup-form" hidden>
            <h3>Create Account</h3>

            <input type="text" id="signup-username" placeholder="Username">
            <input type="email" id="signup-email" placeholder="Email" autocomplete="off">

            <input type="password" id="signup-password" placeholder="Password" autocomplete="new-password">

            <button id="signup-btn">Sign Up</button>

            <p>Already have an account?
                <button id="show-login-btn">Login</button>
            </p>
        </div>
    </section>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/main.js"></script>
</body>

</html>
