<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whiteboard application</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/boardmanagement.css">
    <link rel="stylesheet" href="/css/whiteboard.css">
</head>

<body>
    <section id="auth-screen">
        <h2>Welcome to Whiteboard</h2>

        <div id="login-form">
            <h3>Login</h3>

            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Password">

            <button id="login-btn">Login</button>
            <p id="auth-status"></p>

            <p>Don't have an account?
                <button id="show-signup-btn">Sign Up</button>
            </p>
        </div>

        <div id="signup-form" hidden>
            <h3>Create Account</h3>

            <input type="text" id="signup-username" placeholder="Username">
            <input type="email" id="signup-email" placeholder="Email" autocomplete="off">

            <input type="password" id="signup-password" placeholder="Password" autocomplete="new-password">

            <button id="signup-btn">Sign Up</button>

            <p>Already have an account?
                <button id="show-login-btn">Login</button>
            </p>
        </div>
    </section>
    <div class="container">
        <section id="board-management">
            <h1> My Boards </h1>
            <button id="logout-btn" type="button" class="logout-btn">Logout</button>
            <div class="board-controls">
                <select id="board-select">
                    <option value="">Select a board</option>
                </select>

                <input type="text" id="board-name-input" placeholder="Enter board name">

                <button id="create-board-btn" type="button">
                    Create Board
                </button>

                <button id="rename-board-btn" type="button">
                    Rename Board
                </button>

                <button id="delete-board-btn" type="button">
                    Delete Board
                </button>
                <button id="open-board-btn" type="button">Open Board</button>

                <button id="share-board-btn" type="button">
                    Share Board
                </button>

                <p id="board-status" role="status"></p>

                <div id="sharing-controls" hidden>
                    <label for="share-permission">Permission:</label>

                    <select id="share-permission">
                        <option value="VIEW">View only</option>
                        <option value="EDIT">Can edit</option>
                    </select>

                    <button id="generate-share-link-btn" type="button">
                        Generate Link
                    </button>

                    <p id="share-status" role="status"></p>

                    <p id="share-link-label"></p>

                    <a id="share-link-anchor" href="#" target="_blank" rel="noopener noreferrer" hidden>
                        Share Board
                    </a>

                    <input type="hidden" id="share-link-input">
                    <button id="copy-share-link-btn" type="button">
                        Copy Link
                    </button>

                    <div id="existing-share-links"></div>
                </div>
            </div>
        </section>
        <section id="whiteboard-screen" hidden>
            <section class="tools-board">
                <div class="row">
                    <label class="title">Shapes</label>
                    <ul class="options">
                        <li class="option tool" id="rectangle">
                            <img src="/icons/rectangle.svg" alt="">
                            <span>Rectangle</span>
                        </li>
                        <li class="option tool" id="circle">
                            <img src="/icons/circle.svg" alt="">
                            <span>Circle</span>
                        </li>
                        <li class="option tool" id="triangle">
                            <img src="/icons/triangle.svg" alt="">
                            <span>Triangle</span>
                        </li>
                        <li class="option tool" id="arrow">
                            <img src="/icons/arrow.svg" alt="">
                            <span>Arrow</span>
                        </li>
                        <li class="option">
                            <input type="checkbox" id="fill-color">
                            <label for="fill-color">Fill Color</label>
                        </li>
                    </ul>
                </div>
                <div class="row">
                    <label class="title">Options</label>
                    <ul class="options">
                        <li class="option tool" id="text">
                            <img src="/icons/text.svg" alt="">
                            <span>Text Box</span>
                        </li>
                        <li class="option tool active" id="brush">
                            <img src="/icons/brush.svg" alt="">
                            <span>Brush</span>
                        </li>
                        <li class="option tool" id="eraser">
                            <img src="/icons/eraser.svg" alt="">
                            <span>Eraser</span>
                        </li>
                        <li class="option">
                            <input type="range" id="size-slider" min="1" max="30" value="5">
                        </li>
                    </ul>
                </div>
                <div class="row colors">
                    <label class="title">Colors</label>
                    <ul class="options">
                        <li class="option selected"></li>
                        <li class="option"></li>
                        <li class="option"></li>
                        <li class="option"></li>
                        <li class="option">
                            <input type="color" id="color-picker" value="#4A98F7">
                        </li>
                    </ul>
                </div>
                <div class="row buttons">
                    <button class="clear-canvas">Clear Canvas</button>
                    <button class="save-img">Save As Image</button>
                    <button id="back-to-boards-btn" type="button">
                        Back to My Boards
                    </button>
                </div>
            </section>

            <section class="drawing-board">
                <canvas></canvas>
                <div id="text-box-layer"></div>

                <div class="collaborator-cursors"></div>
            </section>
        </section>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/main.js"></script>
</body>

</html>
